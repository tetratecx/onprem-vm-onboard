# The service the VMs join.
#
# A WorkloadGroup is the template the onboarding plane stamps a WorkloadEntry
# from when a VM is admitted. The VM points at it by namespace and name
# (WORKLOAD_GROUP_NAMESPACE / WORKLOAD_GROUP_NAME in vm/vm.env).
#
# The Service and ServiceAccount below are what the rest of the mesh routes to.
# Keep them even when no pod of this app runs in the cluster: the VMs provide the
# endpoints.
---
apiVersion: v1
kind: Service
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
  labels:
    app: ${APP_NAME}
    service: ${APP_NAME}
spec:
  ports:
  - port: 80
    targetPort: 8000
    name: http
  - port: 3000
    targetPort: 3000
    name: tcp
  selector:
    app: ${APP_NAME}
---
# The identity the onboarded VMs run as inside the mesh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-${APP_NAME}
  namespace: ${APP_NAMESPACE}
  labels:
    app: ${APP_NAME}
---
apiVersion: networking.istio.io/v1alpha3
kind: WorkloadGroup
metadata:
  name: ${WORKLOAD_GROUP_NAME}
  namespace: ${APP_NAMESPACE}
  labels:
    app: ${APP_NAME}
    version: v1
spec:
  template:
    labels:
      app: ${APP_NAME}
      version: v1
      # 05-sidecar.yaml selects on this label, and 04-onboarding-policy.yaml
      # admits VMs into any group labelled app: ${APP_NAME}
      class: vm
    serviceAccount: sa-${APP_NAME}
    network: virtual-machines
