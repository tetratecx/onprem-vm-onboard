# # Serving certificate for the VM onboarding endpoint (the vmgateway).
# #
# # This uses the "selfsigned-ca" ClusterIssuer of the sandbox, which is why the
# # VMs onboard with insecureSkipVerify. On the MS clusters, issue this certificate
# # from the corporate CA instead - change issuerRef below - and then set
# # ONBOARDING_TLS_INSECURE="false" in ms-vm/ms-vm.env.
# #
# # If the certificate is managed outside cert-manager, skip this file entirely and
# # make sure a TLS secret named "vm-onboarding" exists in istio-system.
# ---
# apiVersion: cert-manager.io/v1
# kind: Certificate
# metadata:
#   name: vm-onboarding
#   namespace: istio-system
# spec:
#   secretName: vm-onboarding
#   duration: 21600h # 900d
#   usages:
#   - server auth
#   dnsNames:
#   - ${VM_ENDPOINT}
#   issuerRef:
#     name: selfsigned-ca
#     kind: ClusterIssuer
