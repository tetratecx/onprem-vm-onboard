# Serving certificate for the VM onboarding endpoint (the vmgateway).
#
# The VMs connect to https://${VM_ENDPOINT} to download the onboarding packages
# and to onboard, so the certificate must carry that hostname.
#
# With the self-signed issuer below, the VMs cannot validate the certificate and
# must keep ONBOARDING_TLS_INSECURE="true" in vm/vm.env. Issue it from the
# corporate CA instead (change issuerRef) and set ONBOARDING_TLS_INSECURE="false".
#
# If the certificate is managed outside cert-manager, set INSTALL_CERT="false" in
# cp.env and make sure a TLS secret named "vm-onboarding" exists in istio-system.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vm-onboarding
  namespace: istio-system
spec:
  secretName: vm-onboarding
  duration: 21600h # 900d
  usages:
  - server auth
  dnsNames:
  - ${VM_ENDPOINT}
  issuerRef:
    name: ${CERT_ISSUER_NAME}
    kind: ${CERT_ISSUER_KIND}
