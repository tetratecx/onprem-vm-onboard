# Who may onboard into the WorkloadGroups of this namespace.
#
# The plane evaluates this policy against the verified claims of the token the VM
# presents. The fields come from 02-control-plane-patch.yaml:
#
#   issuer     <- the 'iss' claim, matched exactly
#   subjects   <- the 'sub' claim. For a Keycloak client_credentials token that
#                 is the UUID of the client's service account, NOT the client
#                 name: 'tokenFields.subject' is stripped from the ControlPlane,
#                 so 'azp' cannot be matched here. Read the UUID off a real
#                 token: vm/get-token.sh --decode | grep '"sub"'
#   attributes <- the 'custom_attributes' object, set by the hardcoded claim
#                 mappers that keycloak/add-client.sh adds
#
# install-cp.sh renders both lists from ALLOWED_SUBJECTS and ALLOWED_ATTRIBUTES
# in cp.env.
apiVersion: authorization.onboarding.tetrate.io/v1alpha1
kind: OnboardingPolicy
metadata:
  name: allow-onprem-vms
  namespace: ${APP_NAMESPACE}
spec:
  allow:
  - workloads:
    - jwt:
        issuer: ${KEYCLOAK_ISSUER}
        subjects:
${ALLOWED_SUBJECTS_BLOCK}
${ALLOWED_ATTRIBUTES_BLOCK}
    onboardTo:
    - workloadGroupSelector:
        matchLabels:
          app: ${APP_NAME}
