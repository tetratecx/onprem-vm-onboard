# The VMs run the sidecar without iptables redirection, so Envoy is told
# explicitly where the local application listens and which local addresses to
# bind for outbound traffic.
#
# Without this, an onboarded VM shows up in the mesh but no traffic reaches the
# application on it.
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: ${APP_NAME}-vm-no-iptables
  namespace: ${APP_NAMESPACE}
spec:
  workloadSelector:
    labels:
      app: ${APP_NAME}
      class: vm
  ingress:
  # Inbound mesh traffic for port 8000 is forwarded to the app on localhost.
  - defaultEndpoint: 127.0.0.1:8000
    port:
      name: http
      number: 8000
      protocol: HTTP
  egress:
  # The bind addresses must also be in the VM's /etc/hosts, so the hostnames
  # resolve to the local sidecar, which forwards them into the mesh:
  #   127.0.0.2 zipkin.istio-system
  # install-vm.sh adds those entries for the names in OBSTESTER_HOSTS.
  - bind: 127.0.0.2
    port:
      number: 9411
      name: http-zipkin
      protocol: HTTP
    hosts:
    - istio-system/zipkin.istio-system.svc.cluster.local
  # Port 80 is privileged and Envoy cannot bind it on the VM by default.
  # install-vm.sh runs 'setcap CAP_NET_BIND_SERVICE=+eip /usr/local/bin/envoy'
  # so that it can. Uncomment to reach another mesh service from the VM.
  # - bind: 127.0.0.2
  #   port:
  #     number: 80
  #     name: http-accounting
  #     protocol: HTTP
  #   hosts:
  #   - ./accounting.${APP_NAMESPACE}.svc.cluster.local
